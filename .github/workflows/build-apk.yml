name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Sandtrix-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sandtrix-Mobile-Debug-APK
          path: Sandtrix-Mobile.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Sandtrix Mobile Standalone APK"
          body: "Standalone Android APK package for Sandtrix Mobile with embedded offline assets and native hardware gyroscope support."
          files: Sandtrix-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
